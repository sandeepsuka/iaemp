version: "3.9"

services:
  db:
    image: postgres:15
    container_name: iaemp-db
    environment:
      POSTGRES_DB: iaemp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: iaemp-backend
    container_name: iaemp-backend
    build: ./iaemp-backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      # DATABASE
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: iaemp_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      # JWT (CRITICAL)
      SECRET_KEY: iaemp-super-secret-key-change-this
      ALGORITHM: HS256

  nginx:
    image: nginx:latest
    container_name: iaemp-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./iaemp-frontend:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  pgdata:
