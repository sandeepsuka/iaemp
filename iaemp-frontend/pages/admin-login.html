<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login | IAEMP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Site CSS -->
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>

  <!-- HEADER -->
  <header id="site-header"></header>

  <!-- MAIN -->
  <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">

      <h3 class="text-center mb-2">Admin Login</h3>
      <p class="text-center text-muted mb-4">
        Authorized IAEMP administrators only
      </p>

      <!-- ERROR -->
      <div id="errorBox" class="alert alert-danger d-none"></div>

      <!-- FORM -->
      <form id="adminLoginForm" autocomplete="off">

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Login
        </button>

      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer id="site-footer"></footer>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- LOGIN LOGIC -->
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorBox");

      errorBox.classList.add("d-none");

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            email: email,
            password: password
          })
        });

        if (!response.ok) {
          throw new Error("Login failed");
        }

        // ✅ Redirect ONLY after cookie is set
        window.location.replace("/pages/admin.html");

      } catch (err) {
        errorBox.textContent = "Invalid admin email or password.";
        errorBox.classList.remove("d-none");
      }
    });
  </script>

</body>
</html>
