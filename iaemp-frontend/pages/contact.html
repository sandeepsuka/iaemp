<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact IAEMP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="container my-5">

    <h1 class="mb-4">Contact Us</h1>

    <p>
      For membership, training programs, or general queries,
      please contact us using the details below.
    </p>

    <hr class="my-4">

    <!-- CONTACT DETAILS -->
    <h2 class="mb-3">Contact Information</h2>

    <p>
      <strong>Email:</strong> info@iaemp.org<br>
      <strong>Phone:</strong> +91-485789375937<br>
      <strong>Address:</strong> IAEMP Office, India
    </p>

    <hr class="my-4">

    <!-- CONTACT FORM -->
    <h2 class="mb-3">Send Us a Message</h2>

    <form id="contactForm">

  <div class="mb-3">
    <label class="form-label">Your Name</label>
    <input 
      type="text" 
      class="form-control" 
      name="name"
      placeholder="Enter your name"
      required
    >
  </div>

  <div class="mb-3">
    <label class="form-label">Your Email</label>
    <input 
      type="email" 
      class="form-control" 
      name="email"
      placeholder="Enter your email"
      required
    >
  </div>

  <div class="mb-3">
    <label class="form-label">Message</label>
    <textarea 
      class="form-control" 
      name="message"
      rows="4"
      placeholder="Enter your message"
      required
    ></textarea>
  </div>

  <button type="submit" class="btn btn-primary">
    Send Message
  </button>

</form>


  </main>

  <!-- FOOTER -->
  <footer id="site-footer"></footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="../assets/js/main.js"></script>

  <script>
  const form = document.getElementById("contactForm");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = new FormData(form);

    const response = await fetch("/api/contact", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams(formData)
    });

    if (response.ok) {
      alert("Message sent successfully!");
      form.reset();
    } else {
      alert("Error sending message. Please try again.");
    }
  });
</script>


</body>
</html>
