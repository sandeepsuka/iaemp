<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IAEMP | Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Site Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="container my-5">

    <!-- TITLE -->
    <section class="mb-4">
      <h1 class="mb-1">Admin Dashboard</h1>
      <p class="text-muted mb-2">
        Internal IAEMP administration panel
      </p>
      <div class="alert alert-warning mb-0">
        <strong>Restricted Access:</strong> Authorized administrators only.
      </div>
    </section>

    <!-- CONTACT MESSAGES -->
    <section class="mb-5">
      <h3 class="mb-3">📩 Contact Messages</h3>

      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="contactTable">
            <tr>
              <td colspan="4" class="text-center text-muted">
                Loading contact messages…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- MEMBERSHIP APPLICATIONS -->
    <section class="mb-5">
      <h3 class="mb-3">🧾 Membership Applications</h3>

      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
          <thead class="table-light">
            <tr>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Type</th>
              <th>Organization</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="membershipTable">
            <tr>
              <td colspan="6" class="text-center text-muted">
                Loading membership applications…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ACTIONS -->
    <div class="mt-4">
      <button id="logoutBtn" class="btn btn-danger">
        Logout
      </button>
    </div>

  </main>

  <!-- FOOTER -->
  <footer id="site-footer"></footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Site JS -->
  <script src="../assets/js/main.js"></script>

  <!-- ================= AUTH GUARD ================= -->
  <script>
    (async function protectAdmin() {
      try {
        const res = await fetch("/api/admin/me", {
          credentials: "include"
        });

        if (!res.ok) {
          window.location.replace("/pages/admin-login.html");
        }
      } catch {
        window.location.replace("/pages/admin-login.html");
      }
    })();
  </script>

  <!-- ================= LOGOUT ================= -->
  <script>
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await fetch("/api/admin/logout", {
          method: "POST",
          credentials: "include"
        });
      } finally {
        window.location.replace("/pages/admin-login.html");
      }
    });
  </script>

  <!-- ================= LOAD CONTACTS ================= -->
  <script>
    async function loadContacts() {
      const table = document.getElementById("contactTable");

      try {
        const res = await fetch("/api/admin/contacts", {
          credentials: "include"
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        table.innerHTML = "";

        if (!data.length) {
          table.innerHTML = `
            <tr>
              <td colspan="4" class="text-center text-muted">
                No contact messages found
              </td>
            </tr>`;
          return;
        }

        data.forEach(item => {
          table.innerHTML += `
            <tr>
              <td>${item.name}</td>
              <td>${item.email}</td>
              <td>${item.message}</td>
              <td>${new Date(item.created_at).toLocaleString()}</td>
            </tr>`;
        });

      } catch {
        table.innerHTML = `
          <tr>
            <td colspan="4" class="text-center text-danger">
              Failed to load contact messages
            </td>
          </tr>`;
      }
    }

    loadContacts();
  </script>

  <!-- ================= LOAD MEMBERSHIPS ================= -->
  <script>
    async function loadMemberships() {
      const table = document.getElementById("membershipTable");

      try {
        const res = await fetch("/api/admin/memberships", {
          credentials: "include"
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        table.innerHTML = "";

        if (!data.length) {
          table.innerHTML = `
            <tr>
              <td colspan="6" class="text-center text-muted">
                No membership applications found
              </td>
            </tr>`;
          return;
        }

        data.forEach(item => {
          table.innerHTML += `
            <tr>
              <td>${item.full_name}</td>
              <td>${item.email}</td>
              <td>${item.phone}</td>
              <td>${item.membership_type}</td>
              <td>${item.organization || "-"}</td>
              <td>${new Date(item.created_at).toLocaleString()}</td>
            </tr>`;
        });

      } catch {
        table.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-danger">
              Failed to load membership applications
            </td>
          </tr>`;
      }
    }

    loadMemberships();
  </script>

</body>
</html>
